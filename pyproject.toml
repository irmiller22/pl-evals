[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "premier-league-evals-poc"
version = "0.1.0"
description = "A public experiment comparing AI models against Premier League data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6,<7",
]

[project.scripts]
evals = "evals.cli:app"
pl-ingest = "scripts.ingest_dataset:app"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app", "evals", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
